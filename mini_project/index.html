<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Directory</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1f2937;
      color: white;
      text-align: center;
      padding: 25px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .intro {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    #users {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .user-card {
      background-color: white;
      padding: 18px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .user-card h3 {
      margin-top: 0;
      color: #2563eb;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      background-color: #1f2937;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Student Directory</h1>
    <p>CSC220 Web Development II</p>
  </header>

  <main>

    <section class="intro">
      <h2>API Mini Project</h2>

      <p>
        Click the button below to retrieve user information
        from a public API.
      </p>

      <button id="loadButton">Load Users</button>

      <p id="message">
        Click the button to load user information.
      </p>
    </section>

    <section>
      <h2>User List</h2>

      <ul id="users"></ul>
    </section>

  </main>

  <footer>
    <p>CSC220 - GitHub Group Activity</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
